name: Resolve APIM routing (DfE overlay)

on:
  push:
    branches: [main]
    paths:
      - '**/service-dependencies/service-dependencies.json'
      - 'dfe-overlay/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out das-apim-endpoints
        uses: actions/checkout@v4
        with:
          repository: SkillsFundingAgency/das-apim-endpoints
          path: .apim
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the overlay
        run: node --test dfe-overlay/test/*.test.mjs

      - name: Extract APIM routes
        run: node dfe-overlay/extract-apim-routes.mjs .apim

      - name: Resolve dependencies
        run: node dfe-overlay/resolve-dependencies.mjs

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          paths=(das-apim-endpoints/apim-routes '*/service-dependencies/resolved-dependencies.json')
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No routing changes."
            exit 0
          fi
          branch="dfe-apim-routing/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Update resolved APIM routing"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update resolved APIM routing" \
            --body "Regenerated by the DfE overlay (dfe-overlay/) from das-apim-endpoints and the latest service-dependency scans."
