name: Dependabot alert report

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set branch suffix
        id: suffix
        run: echo "value=$(date -u +%Y%m%d-%H%M%S)-$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Generate Dependabot alert report
        env:
          GH_TOKEN: ${{ secrets.ORG_DEPENDABOT_TOKEN }}
          GITHUB_ORG: SkillsFundingAgency
        run: node .github/scripts/generate-dependabot-report.mjs

      - name: Open pull request with changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: dependabot-alerts.json
          commit-message: Update Dependabot alert report
          title: Update Dependabot alert report
          body: |
            Automated refresh of `dependabot-alerts.json` — Dependabot security alerts
            for every active repository in the SkillsFundingAgency organisation.

            Generated by the `dependabot-report` workflow.
          branch: dependabot-alerts/${{ steps.suffix.outputs.value }}
