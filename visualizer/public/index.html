<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Service catalogue</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Service catalogue home">
      <span class="brand-mark" aria-hidden="true">SC</span>
      <span>Service catalogue</span>
    </a>
    <label class="source-picker" for="source-select">
      <span>Source</span>
      <select id="source-select" aria-label="Catalogue source"></select>
    </label>
  </header>

  <main>
    <section class="hero" aria-labelledby="source-title">
      <div>
        <p class="eyebrow">Architecture inventory</p>
        <h1 id="source-title">Loading catalogue…</h1>
        <a id="repo-link" class="repo-link" href="#" target="_blank" rel="noreferrer"></a>
      </div>
      <dl id="source-stats" class="stats" aria-label="Source summary"></dl>
    </section>

    <nav id="view-tabs" class="tabs" aria-label="Catalogue views"></nav>
    <section id="toolbar" class="toolbar" aria-label="View controls"></section>
    <section id="content" class="content" aria-live="polite">
      <div class="loading">Reading catalogue data…</div>
    </section>
  </main>

  <template id="empty-template">
    <div class="empty-state">
      <span class="empty-icon" aria-hidden="true">◇</span>
      <h2>No data available</h2>
      <p>This source does not include data for this view.</p>
    </div>
  </template>
  <script type="module" src="/app.js"></script>
</body>
</html>
